<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Production sigil flow checks</title>
    <style>
      body { font: 16px system-ui; max-width: 760px; margin: 40px auto; padding: 0 20px; }
      .pass { color: #087f5b; }
      .fail { color: #c92a2a; }
      #appFixture { position: fixed; left: -10000px; width: 320px; }
      #stage { width: 320px; height: 200px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm": "data:text/javascript,export const FilesetResolver%3D%7BforVisionTasks:async()%3D%3E(%7B%7D)%7D%3Bexport const HandLandmarker%3D%7BcreateFromOptions:async()%3D%3Ewindow.__fakeHandLandmarker%7D%3B"
        }
      }
    </script>
  </head>
  <body>
    <h1>Production sigil flow checks</h1>
    <p>
      Scope: the current First Binding camera and Spacebar flow with camera and MediaPipe
      boundaries stubbed.
    </p>
    <p id="summary">Running...</p>
    <div id="results"></div>

    <main id="appFixture" aria-hidden="true">
      <p id="status">Camera is off</p>
      <button id="startButton" type="button">Start camera</button>
      <button id="finishButton" type="button" disabled>Finish stroke</button>
      <button id="audioButton" type="button" aria-pressed="false">Enable ambience</button>
      <button id="resetButton" type="button">Reset</button>
      <div id="stage">
        <video id="camera" muted></video>
        <canvas id="drawingCanvas"></canvas>
        <div id="stageMessage"></div>
      </div>
      <h2 id="challengeTitle"></h2>
      <p id="challengeElement"></p>
      <p id="challengeMeaning"></p>
      <div id="targetPreview"></div>
      <ol>
        <li data-stroke-key="vessel"></li>
        <li data-stroke-key="apex"></li>
      </ol>
      <div class="feedback-panel">
        <p id="feedbackTitle"></p>
        <p id="feedbackDetail"></p>
      </div>
      <span id="score"></span>
    </main>

    <script>
      const scheduledFrames = new Map();
      let nextFrameId = 1;
      let videoTime = 0;
      let attachedStream = null;

      window.requestAnimationFrame = (callback) => {
        const id = nextFrameId++;
        scheduledFrames.set(id, callback);
        return id;
      };
      window.cancelAnimationFrame = (id) => scheduledFrames.delete(id);

      const track = new EventTarget();
      track.stop = () => {};
      const stream = {
        active: true,
        getTracks: () => [track],
        getVideoTracks: () => [track],
      };
      Object.defineProperty(navigator, "mediaDevices", {
        configurable: true,
        value: { getUserMedia: async () => stream },
      });

      const video = document.querySelector("#camera");
      Object.defineProperties(video, {
        readyState: { configurable: true, get: () => 4 },
        videoWidth: { configurable: true, get: () => 640 },
        videoHeight: { configurable: true, get: () => 360 },
        srcObject: {
          configurable: true,
          get: () => attachedStream,
          set: (value) => {
            attachedStream = value;
          },
        },
        currentTime: {
          configurable: true,
          get: () => videoTime,
          set: (value) => {
            videoTime = value;
          },
        },
      });
      video.play = async () => {};

      window.__fakeLandmarkResult = { landmarks: [] };
      window.__fakeHandLandmarker = {
        detectForVideo: () => window.__fakeLandmarkResult,
        close: () => {},
      };
    </script>

    <script type="module">
      const tests = [];
      const assert = (condition, message) => {
        if (!condition) {
          throw new Error(message);
        }
      };
      const test = async (name, check) => {
        try {
          await check();
          tests.push({ name, passed: true });
        } catch (error) {
          tests.push({ name, passed: false, error });
        }
      };
      const waitFor = async (check, message) => {
        for (let attempt = 0; attempt < 50; attempt += 1) {
          if (check()) {
            return;
          }
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
        throw new Error(message);
      };
      const runFrame = (timestamp) => {
        const entry = scheduledFrames.entries().next().value;
        assert(entry, "no animation frame was scheduled");
        const [id, callback] = entry;
        scheduledFrames.delete(id);
        callback(timestamp);
      };
      const dispatchSpace = (type) =>
        window.dispatchEvent(new KeyboardEvent(type, {
          code: "Space",
          key: " ",
          bubbles: true,
          cancelable: true,
        }));
      const setFingertip = (x, y) => {
        const landmarks = Array.from({ length: 9 }, () => ({ x: 0.5, y: 0.5 }));
        landmarks[8] = { x, y };
        window.__fakeLandmarkResult = { landmarks: [landmarks] };
      };
      const stageToLandmark = ({ x, y }) => {
        const stage = document.querySelector("#stage");
        const rect = stage.getBoundingClientRect();
        const scale = Math.max(rect.width / video.videoWidth, rect.height / video.videoHeight);
        const renderedWidth = video.videoWidth * scale;
        const renderedHeight = video.videoHeight * scale;
        const offsetX = (renderedWidth - rect.width) / 2;
        const offsetY = (renderedHeight - rect.height) / 2;
        return {
          x: 1 - (x + offsetX) / renderedWidth,
          y: (y + offsetY) / renderedHeight,
        };
      };
      const trace = (points, timeOffset, frameOffset) => {
        points.forEach((point, index) => {
          const landmark = stageToLandmark(point);
          setFingertip(landmark.x, landmark.y);
          video.currentTime = timeOffset + index;
          runFrame(frameOffset + index * 16);
        });
      };
      const ringPoints = Array.from({ length: 16 }, (_, index) => {
        const angle = (index / 15) * Math.PI * 2;
        return {
          x: 160 + Math.cos(angle) * 49,
          y: 100 + Math.sin(angle) * 49,
        };
      });
      const apexPoints = [
        { x: 133.76, y: 70.48 },
        { x: 140.32, y: 85.24 },
        { x: 146.88, y: 100 },
        { x: 153.44, y: 114.76 },
        { x: 160, y: 129.52 },
        { x: 166.56, y: 114.76 },
        { x: 173.12, y: 100 },
        { x: 179.68, y: 85.24 },
        { x: 186.24, y: 70.48 },
      ];

      await import("../src/main.js");
      document.querySelector("#startButton").click();
      await waitFor(
        () => document.querySelector("#status").textContent === "Camera ready — hold Space to draw the Vessel.",
        "camera did not reach ready state",
      );

      await test("camera flow exposes the current Water sigil", () => {
        assert(document.querySelector("#challengeTitle").textContent === "First Binding", "sigil title missing");
        assert(document.querySelector("#challengeElement").textContent === "Element: Water", "Water affinity missing");
        assert(
          document.querySelector("#targetPreview").getAttribute("aria-label").includes("First Binding water sigil"),
          "current stencil description missing",
        );
      });

      await test("a short sampled vessel ring commits on Space release", () => {
        dispatchSpace("keydown");
        trace(ringPoints, 10, 100);
        dispatchSpace("keyup");

        assert(document.querySelector("#score").textContent === "0", "first stroke changed score");
        assert(document.querySelector("#feedbackTitle").textContent === "Vessel inscribed", "vessel was not accepted");
        assert(document.querySelector('[data-stroke-key="vessel"]').classList.contains("is-complete"), "vessel progress stayed active");
      });

      await test("the second stroke completes the sigil automatically", () => {
        dispatchSpace("keydown");
        trace(apexPoints, 30, 400);
        dispatchSpace("keyup");

        assert(document.querySelector("#score").textContent === "1", "sigil did not increment score");
        assert(document.querySelector("#feedbackTitle").textContent === "Water sigil awakened", "completion feedback missing");
        assert(!document.querySelector("[data-water-celebration]").hidden, "water celebration did not start");
      });

      await test("Reset clears score and hides the celebration", () => {
        document.querySelector("#resetButton").click();

        assert(document.querySelector("#score").textContent === "0", "Reset kept the score");
        assert(document.querySelector("[data-water-celebration]").hidden, "Reset left celebration visible");
        assert(document.querySelector("#feedbackTitle").textContent === "Ready when you are", "Reset feedback missing");
      });

      const passed = tests.filter(({ passed: ok }) => ok).length;
      const failed = tests.length - passed;
      document.querySelector("#results").innerHTML = tests
        .map(({ name, passed: ok, error }) =>
          `<p class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}: ${name}${error ? ` — ${error.message}` : ""}</p>`)
        .join("");
      document.querySelector("#summary").textContent = `${passed} passed, ${failed} failed`;
      document.body.dataset.status = failed === 0 ? "passed" : "failed";
      window.__lineSpeedResults = { passed, failed, tests };

      if (failed > 0) {
        throw new Error(`${failed} production sigil check(s) failed`);
      }
    </script>
  </body>
</html>
