<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>One Euro filter regression checks</title>
    <style>
      body { font: 16px system-ui; max-width: 700px; margin: 40px auto; padding: 0 20px; }
      .pass { color: #087f5b; }
      .fail { color: #c92a2a; }
    </style>
  </head>
  <body>
    <h1>One Euro filter regression checks</h1>
    <p id="summary">Running…</p>
    <div id="results"></div>
    <script type="module">
      import { OneEuroFilter, VectorOneEuroFilter } from "../src/one-euro-filter.js";

      const tests = [];
      const check = (name, assertion) => {
        try {
          tests.push({ name, passed: Boolean(assertion()) });
        } catch (error) {
          tests.push({ name, passed: false, error });
        }
      };
      const nearlyEqual = (left, right) => Math.abs(left - right) < 1e-12;

      check("irregular timestamps produce finite output", () => {
        const filter = new OneEuroFilter();
        return [0, 17, 61, 149]
          .map((timestamp, index) => filter.filter(index * 10, timestamp))
          .every(Number.isFinite);
      });

      check("irregular timestamps smooth increasing samples", () => {
        const filter = new OneEuroFilter({ minCutoff: 1, beta: 0 });
        const first = filter.filter(0, 0);
        const second = filter.filter(10, 17);
        const third = filter.filter(20, 149);
        return first === 0 && second > first && second < 10 && third > second && third < 20;
      });

      check("duplicate timestamps start from the new sample", () => {
        const filter = new OneEuroFilter();
        filter.filter(0, 100);
        filter.filter(10, 120);
        const duplicate = filter.filter(40, 120);
        const following = filter.filter(50, 140);
        return duplicate === 40 && following > 40 && following < 50;
      });

      check("non-monotonic timestamps start from the new sample", () => {
        const filter = new OneEuroFilter();
        filter.filter(0, 100);
        filter.filter(10, 140);
        const backwards = filter.filter(-20, 110);
        const following = filter.filter(-10, 130);
        return backwards === -20 && following > -20 && following < -10;
      });

      check("reset makes the next scalar sample unfiltered", () => {
        const filter = new OneEuroFilter();
        filter.filter(0, 0);
        filter.filter(100, 20);
        filter.reset();
        return filter.filter(-35, 500) === -35;
      });

      check("reset restores fresh scalar behavior", () => {
        const options = { minCutoff: 1.1, beta: 0.06, derivativeCutoff: 0.8 };
        const resetFilter = new OneEuroFilter(options);
        const freshFilter = new OneEuroFilter(options);
        resetFilter.filter(0, 0);
        resetFilter.filter(100, 40);
        resetFilter.reset();
        const samples = [
          { value: 12, timestamp: 500 },
          { value: 28, timestamp: 529 },
          { value: 18, timestamp: 610 },
        ];
        return samples.every(({ value, timestamp }) =>
          nearlyEqual(resetFilter.filter(value, timestamp), freshFilter.filter(value, timestamp)),
        );
      });

      check("vector filtering matches independent scalar filters", () => {
        const options = { minCutoff: 1.3, beta: 0.03 };
        const vector = new VectorOneEuroFilter(options);
        const xFilter = new OneEuroFilter(options);
        const yFilter = new OneEuroFilter(options);
        const samples = [
          { point: { x: 2, y: -5 }, timestamp: 0 },
          { point: { x: 30, y: 8 }, timestamp: 13 },
          { point: { x: 9, y: 40 }, timestamp: 72 },
          { point: { x: 50, y: 12 }, timestamp: 155 },
        ];
        return samples.every(({ point, timestamp }) => {
          const actual = vector.filter(point, timestamp);
          return (
            nearlyEqual(actual.x, xFilter.filter(point.x, timestamp)) &&
            nearlyEqual(actual.y, yFilter.filter(point.y, timestamp))
          );
        });
      });

      check("x history does not affect vector y output", () => {
        const left = new VectorOneEuroFilter();
        const right = new VectorOneEuroFilter();
        const samples = [
          { leftX: 0, rightX: 1000, y: 4, timestamp: 0 },
          { leftX: 5, rightX: -800, y: 18, timestamp: 21 },
          { leftX: 10, rightX: 600, y: 7, timestamp: 95 },
        ];
        return samples.every(({ leftX, rightX, y, timestamp }) => {
          const leftOutput = left.filter({ x: leftX, y }, timestamp);
          const rightOutput = right.filter({ x: rightX, y }, timestamp);
          return nearlyEqual(leftOutput.y, rightOutput.y);
        });
      });

      const passed = tests.filter((test) => test.passed).length;
      const failed = tests.length - passed;
      document.documentElement.dataset.passed = String(passed);
      document.documentElement.dataset.failed = String(failed);
      document.querySelector("#summary").textContent = `${passed} passed, ${failed} failed`;
      document.querySelector("#results").innerHTML = tests
        .map(({ name, passed: didPass, error }) =>
          `<p class="${didPass ? "pass" : "fail"}">${didPass ? "PASS" : "FAIL"}: ${name}${error ? ` (${error.message})` : ""}</p>`,
        )
        .join("");

      if (failed > 0) {
        throw new Error(`${failed} One Euro filter regression check(s) failed.`);
      }
    </script>
  </body>
</html>
